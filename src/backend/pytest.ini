[pytest]
# The backend suite is tests/ only. The Skill catalog under app/ carries its
# own tests -- they are payload for a Hermes worker, run in the flat shape a
# deployed Skill has, and 9 of the shared vault_manager ones fail today on a
# real pre-existing bug (long_path's \?\ prefix leaking back to callers --
# the same root cause fixed in index_builder_lib on 2026-09-06). Collecting
# them here would leave the default run permanently red and destroy its
# signal; they are not hidden, they are run deliberately:
#
#   pytest app/business/core/skills/managers/tests
#   pytest app/business/core/skills/catalog/outlook/email-thread-capture/scripts/tests
testpaths = tests

# Registered so an unknown-marker warning cannot hide a typo'd one -- a
# misspelled marker would silently NOT opt out, and the test would then
# run against a sandboxed store while claiming it needed the real one.
markers =
    reads_the_real_data_store: needs the operator's real artifacts, so conftest's data-store sandbox is skipped for it
