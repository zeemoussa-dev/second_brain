<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      /* This install's theme, applied before the first paint.
         The palette lives on the server (Settings > Branding), which is one
         request away -- long enough for a light install to flash the shipped
         dark copper on every load. So the last known theme is cached in
         localStorage and applied here, synchronously, before the bundle is
         even fetched; BrandingProvider then corrects it from the server.
         Every value is pre-computed by theme.ts, so this stays attribute
         writes with no logic to drift out of step. */
      try {
        var cached = JSON.parse(localStorage.getItem('second-brain.theme') || 'null');
        if (cached) {
          var root = document.documentElement;
          if (cached.mode === 'light') root.setAttribute('data-theme', 'light');
          if (cached.font) root.setAttribute('data-font', cached.font);
          var properties = cached.properties || [];
          for (var i = 0; i < properties.length; i++) {
            root.style.setProperty(properties[i][0], properties[i][1]);
          }
        }
      } catch (error) {
        /* A blocked or corrupt store just means one frame of the default. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
